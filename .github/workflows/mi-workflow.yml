name: Pro-Wyscout-Femenino-Engine

on:
  schedule:
    - cron: '*/20 * * * *' # Cada 20 minutos
  workflow_dispatch: # Permite ejecución manual

jobs:
  scrape_and_analyze:
    runs-on: ubuntu-latest
    # AÑADIMOS ESTO AQUÍ ARRIBA (Global)
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      LANG: "es_ES.UTF-8"
      LC_ALL: "es_ES.UTF-8"
      LANGUAGE: "es_ES.UTF-8"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      # ... resto de pasos igual ...

      
        
      - name: Install Dependencies
        run: |
          # Añadimos browserforge y python-dotenv a la lista
          pip install scrapling supabase requests curl-cffi patchright playwright msgspec lxml browserforge python-dotenv
          
          # Configuramos los navegadores
          python -m patchright install chromium
          python -m patchright install-deps chromium
          playwright install chromium
          
      - name: Run Orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # Limpiamos las variables de entorno antes de lanzar el script
        run: |
          export SUPABASE_URL=$(echo $SUPABASE_URL | tr -d '\r\n[:cntrl:]')
          export SUPABASE_KEY=$(echo $SUPABASE_KEY | tr -d '\r\n[:cntrl:]')
          python main_orchestrator.py
