name: Pro-Wyscout-Femenino-Engine

on:
  schedule:
    - cron: '*/20 * * * *' # Cada 20 minutos
  workflow_dispatch: # Permite ejecución manual

jobs:
  scrape_and_analyze:
    runs-on: ubuntu-latest
    # AÑADIMOS ESTO AQUÍ ARRIBA (Global)
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      LANG: "es_ES.UTF-8"
      LC_ALL: "es_ES.UTF-8"
      LANGUAGE: "es_ES.UTF-8"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      # ... resto de pasos igual ...

      
        
      - name: Install Dependencies
        run: |
          # Añadimos browserforge y python-dotenv a la lista
          pip install scrapling supabase requests curl-cffi patchright playwright msgspec lxml browserforge python-dotenv
          
          # Configuramos los navegadores
          python -m patchright install chromium
          python -m patchright install-deps chromium
          playwright install chromium
          
      - name: Run Orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # ESTO SOLUCIONA EL ERROR UnicodeEncodeError:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LANG: C.UTF-8
        run: python main_orchestrator.py
